<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="40" fill="#0c0c1d"/>
  <!-- Outer gold pokeball ring -->
  <circle cx="96" cy="96" r="68" fill="none" stroke="#ffcb05" stroke-width="7"/>
  <!-- Horizontal band line -->
  <line x1="28" y1="96" x2="164" y2="96" stroke="#ffcb05" stroke-width="7"/>
  <!-- Center circle background -->
  <circle cx="96" cy="96" r="24" fill="#0c0c1d" stroke="#ffcb05" stroke-width="7"/>
  <!-- G letter -->
  <text x="96" y="105" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffcb05">G</text>
  <!-- Subtle outer glow -->
  <circle cx="96" cy="96" r="72" fill="none" stroke="rgba(255,203,5,0.15)" stroke-width="2"/>
</svg>
