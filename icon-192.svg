<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="#0c0c1d"/>
  <!-- Subtle background glow -->
  <circle cx="96" cy="96" r="80" fill="none" stroke="rgba(255,203,5,0.06)" stroke-width="40"/>
  <!-- Outer gold pokeball ring -->
  <circle cx="96" cy="96" r="64" fill="none" stroke="#ffcb05" stroke-width="5" filter="url(#glow)"/>
  <!-- Horizontal band line -->
  <line x1="32" y1="96" x2="160" y2="96" stroke="#ffcb05" stroke-width="5"/>
  <!-- Center circle background -->
  <circle cx="96" cy="96" r="20" fill="#0c0c1d" stroke="#ffcb05" stroke-width="5"/>
  <!-- G letter -->
  <text x="96" y="104" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="24" fill="#ffcb05">G</text>
</svg>
