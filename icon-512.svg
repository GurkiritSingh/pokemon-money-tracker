<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <!-- Pokeball red gradient -->
    <radialGradient id="redTop" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="60%" stop-color="#cc0000"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </radialGradient>
    <!-- White bottom gradient -->
    <radialGradient id="whiteBot" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </radialGradient>
    <!-- Center button gradient -->
    <radialGradient id="centerBtn" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#aaaaaa"/>
    </radialGradient>
    <!-- Outer ring gradient -->
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="50%" stop-color="#222"/>
      <stop offset="100%" stop-color="#444"/>
    </linearGradient>
    <!-- Highlight shine -->
    <radialGradient id="shine" cx="35%" cy="25%" r="40%">
      <stop offset="0%" stop-color="white" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <!-- Shadow for depth -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- G text gradient -->
    <linearGradient id="gGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#444"/>
    </linearGradient>
  </defs>

  <!-- Drop shadow circle -->
  <circle cx="96" cy="99" r="88" fill="rgba(0,0,0,0.3)" filter="url(#shadow)"/>

  <!-- Outer dark ring -->
  <circle cx="96" cy="96" r="90" fill="url(#ring)" stroke="#111" stroke-width="2"/>

  <!-- Red top half -->
  <clipPath id="topHalf">
    <rect x="0" y="0" width="192" height="96"/>
  </clipPath>
  <circle cx="96" cy="96" r="84" fill="url(#redTop)" clip-path="url(#topHalf)"/>

  <!-- White bottom half -->
  <clipPath id="botHalf">
    <rect x="0" y="96" width="192" height="96"/>
  </clipPath>
  <circle cx="96" cy="96" r="84" fill="url(#whiteBot)" clip-path="url(#botHalf)"/>

  <!-- Center band (dark strip) -->
  <rect x="12" y="89" width="168" height="14" fill="url(#ring)" rx="2"/>
  <!-- Band highlight -->
  <rect x="12" y="89" width="168" height="3" fill="rgba(255,255,255,0.1)" rx="1"/>

  <!-- Center button outer ring -->
  <circle cx="96" cy="96" r="28" fill="url(#ring)" stroke="#111" stroke-width="1.5"/>
  <!-- Center button ring detail -->
  <circle cx="96" cy="96" r="25" fill="none" stroke="#555" stroke-width="1"/>
  <!-- Center button face -->
  <circle cx="96" cy="96" r="22" fill="url(#centerBtn)" stroke="#999" stroke-width="0.5"/>
  <!-- Center button inner shadow -->
  <circle cx="96" cy="97" r="20" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>

  <!-- G letter - clean, integrated into center button -->
  <text x="96" y="106" text-anchor="middle" font-family="'Georgia','Times New Roman',serif" font-weight="bold" font-size="34" fill="url(#gGrad)" letter-spacing="-1">G</text>
  <!-- G subtle highlight -->
  <text x="95.5" y="105.5" text-anchor="middle" font-family="'Georgia','Times New Roman',serif" font-weight="bold" font-size="34" fill="rgba(255,255,255,0.15)" letter-spacing="-1">G</text>

  <!-- Top shine/reflection -->
  <ellipse cx="72" cy="55" rx="40" ry="30" fill="url(#shine)"/>

  <!-- Subtle edge highlight on ball -->
  <circle cx="96" cy="96" r="84" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
</svg>
