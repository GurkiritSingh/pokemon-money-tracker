<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#0c0c1d"/>
  <!-- Subtle background glow -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,203,5,0.06)" stroke-width="100"/>
  <!-- Outer gold pokeball ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ffcb05" stroke-width="14" filter="url(#glow)"/>
  <!-- Horizontal band line -->
  <line x1="86" y1="256" x2="426" y2="256" stroke="#ffcb05" stroke-width="14"/>
  <!-- Center circle background -->
  <circle cx="256" cy="256" r="54" fill="#0c0c1d" stroke="#ffcb05" stroke-width="14"/>
  <!-- G letter -->
  <text x="256" y="277" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="64" fill="#ffcb05">G</text>
</svg>
