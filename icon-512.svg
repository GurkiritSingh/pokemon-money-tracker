<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="108" fill="#0c0c1d"/>
  <!-- Outer gold pokeball ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffcb05" stroke-width="18"/>
  <!-- Horizontal band line -->
  <line x1="76" y1="256" x2="436" y2="256" stroke="#ffcb05" stroke-width="18"/>
  <!-- Center circle background -->
  <circle cx="256" cy="256" r="64" fill="#0c0c1d" stroke="#ffcb05" stroke-width="18"/>
  <!-- G letter -->
  <text x="256" y="280" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="76" fill="#ffcb05">G</text>
  <!-- Subtle outer glow -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="rgba(255,203,5,0.15)" stroke-width="4"/>
</svg>
